# Production environment configuration for openfinance-chatbot
# Deployed via: push to 'main' branch

security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: "kiran.tulsulkar@mongodb.com"

# Non-sensitive environment variables (injected directly)
env:
  NODE_ENV: production
  APP_NAME: openfinance-chatbot
  AWS_REGION: us-east-1
  CHAT_COMPLETIONS_MODEL_ID: us.anthropic.claude-sonnet-4-6
  SUPERVISOR_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
  CHECKPOINTS_AIO_COLLECTION: openbankingCheckpoints
  CHECKPOINTS_WRITES_AIO_COLLECTION: openbankingCheckpointWrites
  # Internal K8s service URL for the Open Finance backend (prod release)
  # Format: http://<release-name>-web-app:80
  OPEN_FINANCE_API_URL: http://open-finance-next-gen-prod-web-app:80
  # Queryable Encryption — agent profiles
  KMS_PROVIDER: aws
  ENCRYPTION_CONFIG_PATH: /etc/encryption/encryption_config.json

# Sensitive values loaded from Kubernetes secrets
# The value is the K8s secret name containing the key
# Create with: helm ksec set openfinance-chatbot MONGODB_URI="..." DATABASE_NAME="..." LEAFY_BANK_MONGODB_URI="..." VOYAGE_API_KEY="..."
envSecrets:
  MONGODB_URI: openfinance-chatbot
  DATABASE_NAME: openfinance-chatbot
  LEAFY_BANK_MONGODB_URI: openfinance-chatbot
  VOYAGE_API_KEY: openfinance-chatbot

# AWS IRSA for Bedrock + KMS access
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"

# Mount encryption config (generated by scripts/setup_encrypted_profiles.py)
# Create ConfigMap: kubectl create configmap openfinance-chatbot-encryption-config --from-file=encryption_config.json=backend/encryption_config.json -n <namespace>
extraVolumes:
  - name: encryption-config
    configMap:
      name: openfinance-chatbot-encryption-config

extraVolumeMounts:
  - name: encryption-config
    mountPath: /etc/encryption
    readOnly: true
