# Staging environment configuration for openfinance-chatbot
# Deployed via: push to 'staging' branch

# Non-sensitive environment variables (injected directly)
env:
  NODE_ENV: staging
  APP_NAME: openfinance-chatbot
  AWS_REGION: us-east-1
  CHAT_COMPLETIONS_MODEL_ID: us.anthropic.claude-sonnet-4-20250514-v1:0
  CHECKPOINTS_AIO_COLLECTION: checkpoints_aio
  CHECKPOINTS_WRITES_AIO_COLLECTION: checkpoint_writes_aio
  # Internal K8s service URL for the Open Finance backend
  # Format: http://<release-name>-web-app:80
  OPEN_FINANCE_API_URL: http://open-finance-next-gen-web-app:80

# Sensitive values loaded from Kubernetes secrets
# The value is the K8s secret name containing the key
# Create with: helm ksec set openfinance-chatbot MONGODB_URI="..." DATABASE_NAME="..." LEAFY_BANK_MONGODB_URI="..." VOYAGE_API_KEY="..."
envSecrets:
  MONGODB_URI: openfinance-chatbot
  DATABASE_NAME: openfinance-chatbot
  LEAFY_BANK_MONGODB_URI: openfinance-chatbot
  VOYAGE_API_KEY: openfinance-chatbot

# AWS IRSA for Bedrock access
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"
