<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Finance Chatbot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1923;
    color: #e8eddf;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #001e2b;
    border-bottom: 1px solid #1a3a4a;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .logo {
    width: 32px; height: 32px;
    background: #00ed64;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: #001e2b;
  }

  header h1 { font-size: 16px; font-weight: 600; }

  header .meta {
    margin-left: auto;
    font-size: 12px;
    color: #889397;
    display: flex;
    gap: 16px;
    align-items: center;
  }

  header .meta .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ed64;
    display: inline-block;
  }

  header .meta .dot.disconnected { background: #ff6f61; }

  .controls {
    background: #001e2b;
    border-bottom: 1px solid #1a3a4a;
    padding: 8px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 13px;
  }

  .controls label { color: #889397; }

  .controls input {
    background: #0f1923;
    border: 1px solid #1a3a4a;
    border-radius: 4px;
    padding: 4px 8px;
    color: #e8eddf;
    font-size: 13px;
    width: 180px;
  }

  .controls button {
    background: none;
    border: 1px solid #1a3a4a;
    border-radius: 4px;
    color: #889397;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
  }

  .controls button:hover { border-color: #00ed64; color: #00ed64; }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 720px;
    line-height: 1.5;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    word-wrap: break-word;
  }

  .msg.user, .msg.system, .msg.error {
    white-space: pre-wrap;
  }

  /* Markdown content in assistant messages */
  .msg.assistant p { margin: 0 0 8px 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 {
    color: #00ed64;
    margin: 12px 0 6px 0;
    line-height: 1.3;
  }
  .msg.assistant h1:first-child, .msg.assistant h2:first-child,
  .msg.assistant h3:first-child, .msg.assistant h4:first-child { margin-top: 0; }
  .msg.assistant h1 { font-size: 18px; }
  .msg.assistant h2 { font-size: 16px; }
  .msg.assistant h3 { font-size: 15px; }
  .msg.assistant h4 { font-size: 14px; }

  .msg.assistant ul, .msg.assistant ol {
    margin: 6px 0;
    padding-left: 20px;
  }
  .msg.assistant li { margin: 3px 0; }

  .msg.assistant code {
    background: #0f1923;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
  }

  .msg.assistant pre {
    background: #0f1923;
    border: 1px solid #1a3a4a;
    border-radius: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg.assistant pre code {
    background: none;
    padding: 0;
    font-size: 13px;
  }

  .msg.assistant blockquote {
    border-left: 3px solid #00ed64;
    padding-left: 12px;
    margin: 8px 0;
    color: #a0aab0;
  }

  .msg.assistant table {
    border-collapse: collapse;
    margin: 8px 0;
    width: 100%;
    font-size: 13px;
  }
  .msg.assistant th, .msg.assistant td {
    border: 1px solid #1a3a4a;
    padding: 6px 10px;
    text-align: left;
  }
  .msg.assistant th {
    background: #0f1923;
    color: #00ed64;
    font-weight: 600;
  }

  .msg.assistant strong { color: #ffffff; }
  .msg.assistant a { color: #00ed64; text-decoration: underline; }
  .msg.assistant hr {
    border: none;
    border-top: 1px solid #1a3a4a;
    margin: 10px 0;
  }

  .msg.user {
    align-self: flex-end;
    background: #023430;
    border: 1px solid #00ed64;
    color: #e8eddf;
  }

  .msg.assistant {
    align-self: flex-start;
    background: #1a2a35;
    border: 1px solid #1a3a4a;
  }

  .msg.system {
    align-self: center;
    background: #2a1a00;
    border: 1px solid #ff9f43;
    color: #ffc078;
    font-size: 13px;
    text-align: center;
  }

  .msg.error {
    align-self: center;
    background: #2a0f0f;
    border: 1px solid #ff6f61;
    color: #ff9f9f;
    font-size: 13px;
  }

  .interrupt-box {
    align-self: flex-start;
    background: #1a2a00;
    border: 1px solid #b5e853;
    border-radius: 8px;
    padding: 14px;
    max-width: 720px;
  }

  .interrupt-box h4 {
    color: #b5e853;
    font-size: 13px;
    margin-bottom: 8px;
  }

  .interrupt-box pre {
    font-size: 12px;
    color: #ccc;
    background: #0f1923;
    padding: 8px;
    border-radius: 4px;
    overflow-x: auto;
    margin-bottom: 10px;
  }

  .interrupt-box .actions {
    display: flex;
    gap: 8px;
  }

  .interrupt-box button {
    padding: 6px 14px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }

  .interrupt-box .btn-resume {
    background: #00ed64;
    color: #001e2b;
  }

  .interrupt-box .btn-resume:hover { background: #00c853; }

  .interrupt-box .btn-cancel {
    background: none;
    border: 1px solid #889397;
    color: #889397;
  }

  .typing-indicator {
    align-self: flex-start;
    padding: 10px 14px;
    font-size: 13px;
    color: #889397;
  }

  .typing-indicator span {
    animation: blink 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 60%, 100% { opacity: 0.2; }
    30% { opacity: 1; }
  }

  #input-area {
    background: #001e2b;
    border-top: 1px solid #1a3a4a;
    padding: 14px 20px;
    display: flex;
    gap: 10px;
  }

  #msg-input {
    flex: 1;
    background: #0f1923;
    border: 1px solid #1a3a4a;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e8eddf;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 42px;
    max-height: 120px;
  }

  #msg-input:focus { outline: none; border-color: #00ed64; }

  #send-btn {
    background: #00ed64;
    color: #001e2b;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  #send-btn:hover { background: #00c853; }
  #send-btn:disabled { background: #1a3a4a; color: #555; cursor: not-allowed; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-self: flex-start;
    max-width: 720px;
  }

  .suggestion-chip {
    background: #0f1923;
    border: 1px solid #00ed64;
    border-radius: 20px;
    padding: 8px 16px;
    color: #00ed64;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .suggestion-chip:hover {
    background: #00ed64;
    color: #001e2b;
  }
</style>
</head>
<body>

<header>
  <div class="logo">OF</div>
  <h1>Open Finance Chatbot</h1>
  <div class="meta">
    <span>Thread: <code id="thread-display">none</code></span>
    <span><span class="dot" id="status-dot"></span> <span id="status-text">Ready</span></span>
  </div>
</header>

<div class="controls">
  <label>User ID:</label>
  <input type="text" id="user-id" value="fridaklo" />
  <button onclick="newThread()">New Thread</button>
</div>

<div id="chat-messages"></div>

<div id="input-area">
  <textarea id="msg-input" rows="1" placeholder="Type a message..." onkeydown="handleKey(event)"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const API_BASE = window.location.origin;

// Configure marked for clean output
marked.setOptions({
  breaks: true,
  gfm: true,
});
let threadId = null;
let sending = false;

const messagesEl = document.getElementById("chat-messages");
const inputEl = document.getElementById("msg-input");
const sendBtn = document.getElementById("send-btn");
const threadDisplay = document.getElementById("thread-display");
const statusDot = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");

function setStatus(text, ok = true) {
  statusText.textContent = text;
  statusDot.className = ok ? "dot" : "dot disconnected";
}

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (cls === "assistant") {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing-indicator";
  div.id = "typing";
  div.innerHTML = "Agent thinking<span>.</span><span>.</span><span>.</span>";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typing");
  if (el) el.remove();
}

function showInterrupt(data) {
  const box = document.createElement("div");
  box.className = "interrupt-box";

  const payload = JSON.stringify(data, null, 2);
  box.innerHTML = `
    <h4>Interrupt — Action Required</h4>
    <pre>${escapeHtml(payload)}</pre>
    <div class="actions">
      <button class="btn-resume" onclick="resumeInterrupt(this)">Resume (simulate success)</button>
      <button class="btn-cancel" onclick="this.closest('.interrupt-box').remove()">Dismiss</button>
    </div>
  `;
  messagesEl.appendChild(box);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function newThread() {
  threadId = null;
  threadDisplay.textContent = "none";
  messagesEl.innerHTML = "";
  addMessage("New thread started. Send a message to begin.", "system");
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  // Auto-resize textarea
  setTimeout(() => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }, 0);
}

async function sendMessage() {
  const msg = inputEl.value.trim();
  if (!msg || sending) return;

  const userId = document.getElementById("user-id").value.trim();
  if (!userId) {
    addMessage("Please enter a User ID.", "error");
    return;
  }

  const suggestionsEl = document.getElementById("suggestions");
  if (suggestionsEl) suggestionsEl.remove();

  addMessage(msg, "user");
  inputEl.value = "";
  inputEl.style.height = "auto";
  sending = true;
  sendBtn.disabled = true;
  setStatus("Sending...");
  showTyping();

  try {
    const body = { user_id: userId, message: msg };
    if (threadId) body.thread_id = threadId;

    const res = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    hideTyping();

    if (!res.ok) {
      const err = await res.text();
      addMessage("Error " + res.status + ": " + err, "error");
      setStatus("Error", false);
      return;
    }

    const data = await res.json();
    threadId = data.thread_id;
    threadDisplay.textContent = threadId.substring(0, 8) + "...";

    if (data.response) {
      addMessage(data.response, "assistant");
    }

    if (data.interrupt) {
      showInterrupt(data.interrupt);
    }

    setStatus("Ready");
  } catch (e) {
    hideTyping();
    addMessage("Network error: " + e.message, "error");
    setStatus("Disconnected", false);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function resumeInterrupt(btn) {
  const box = btn.closest(".interrupt-box");
  const userId = document.getElementById("user-id").value.trim();

  if (!threadId) {
    addMessage("No active thread to resume.", "error");
    return;
  }

  box.remove();
  sending = true;
  sendBtn.disabled = true;
  setStatus("Resuming...");
  showTyping();

  try {
    const res = await fetch(API_BASE + "/chat/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        thread_id: threadId,
        user_id: userId,
        resume_data: { status: "success" },
      }),
    });

    hideTyping();

    if (!res.ok) {
      const err = await res.text();
      addMessage("Resume error " + res.status + ": " + err, "error");
      setStatus("Error", false);
      return;
    }

    const data = await res.json();

    if (data.response) {
      addMessage(data.response, "assistant");
    }

    if (data.interrupt) {
      showInterrupt(data.interrupt);
    }

    setStatus("Ready");
  } catch (e) {
    hideTyping();
    addMessage("Resume network error: " + e.message, "error");
    setStatus("Disconnected", false);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function showSuggestions() {
  const suggestions = [
    "I want to port my personal loan to a better rate",
    "Compare my current loan with offers from other banks",
    "What documents do I need for loan portability?",
    "Show me my existing loan details",
  ];

  const container = document.createElement("div");
  container.className = "suggestions";
  container.id = "suggestions";

  suggestions.forEach(text => {
    const chip = document.createElement("button");
    chip.className = "suggestion-chip";
    chip.textContent = text;
    chip.onclick = () => {
      container.remove();
      inputEl.value = text;
      sendMessage();
    };
    container.appendChild(chip);
  });

  messagesEl.appendChild(container);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// Init
addMessage("Hi there! 👋 I'm your Open Finance assistant. I can help you connect bank accounts, view transactions, and analyze your financial data. How can I help you today?", "assistant");
showSuggestions();
inputEl.focus();
</script>
</body>
</html>
