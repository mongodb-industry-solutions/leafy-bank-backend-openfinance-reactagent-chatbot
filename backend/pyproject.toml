[tool.poetry]
name = "openfinance-chatbot"
version = "0.1.0"
description = "Multi-agent chatbot backend for Open Finance consent management and financial advice."
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pymongo = {version = "^4.10.1", extras = ["encryption"]}
pymongo-auth-aws = "^1.3.0"
python-dotenv = "^1.0.1"
fastapi = ">=0.128,<0.140"
uvicorn = ">=0.32,<0.52"
boto3 = "^1.35.70"
botocore = "^1.35.70"
langchain = "^1.0.0"
langchain-aws = "^1.2.0"
langchain-mongodb = ">=0.8,<0.12"
langgraph = "^1.0.0"
voyageai = ">=0.3.2,<0.6.0"
langgraph-checkpoint-mongodb = ">=0.3,<0.5"
httpx = ">=0.27,<0.29"
langchain-mcp-adapters = ">=0.1,<0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
